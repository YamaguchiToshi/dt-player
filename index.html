<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>dt-player</title>
<style>
:root{
  /* 画面まわりは中性の暗色にし、色温度を持たせるのは譜面だけにする。
     そうすると譜面が「光っている面」として浮き上がる。 */
  --chrome:#13131a;
  --lift:#1a1a23;
  --edge:#2b2b36;
  --edge-hi:#3d3d4b;
  --stage:#141d25;
  --lane:#1a2530;
  --ink:#e9edf2;
  --mute:#8b93a2;
  --wait:#7fa8b8;   /* これから鳴る音 */
  --past:#3a4854;   /* 鳴った音 */
  --now:#f5a524;    /* いま鳴っている音 */
  /* 日本語は本文用のゴシック、音名と数字は等幅。楽器の状態表示と
     人への説明を書き分ける。webフォントは読み込まない(回線のため)。 */
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --bar:54px;
  --read:76px;
}
*{box-sizing:border-box}
html{height:100%}
html,body{margin:0}
body{
  position:fixed;inset:0;height:100%;overflow:hidden;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  background:var(--chrome);color:var(--ink);
  font-family:var(--sans);font-feature-settings:"palt" 1;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
}
@supports (height:100dvh){body{height:100dvh}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;
  -webkit-appearance:none;appearance:none;border-radius:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--now);outline-offset:2px}

/* ---- 上の帯:いま何を弾いているか ---- */
.top{
  display:flex;align-items:center;gap:13px;
  height:calc(var(--bar) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) calc(15px + env(safe-area-inset-right)) 0 calc(15px + env(safe-area-inset-left));
  border-bottom:1px solid var(--edge);
}
.open{
  display:flex;align-items:center;gap:9px;flex:none;
  padding:8px 14px 8px 11px;border:1px solid var(--edge);border-radius:4px;
  font-size:13px;color:var(--mute);
}
.open:hover{color:var(--ink);border-color:var(--edge-hi)}
.bars{display:flex;flex-direction:column;gap:3px;width:13px;flex:none}
.bars i{display:block;height:1.5px;background:currentColor}
.title{font-size:15px;font-weight:600;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.alert{margin:0;font-size:12px;color:var(--now);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
.alert[data-on="0"]{display:none}
.count{margin-left:auto;flex:none;font-family:var(--mono);font-size:12px;
  color:var(--mute);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.count b{color:var(--ink);font-weight:600;font-size:17px}

/* ---- 譜面 ---- */
/* Safari のグリッド行では height:100% が 0 になるので、relative の器に
   absolute で広げる。サイズは器の getBoundingClientRect() から取る。 */
#stagewrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--stage)}
#roll{position:absolute;top:0;left:0;width:100%;height:100%;display:block;
  touch-action:none;cursor:pointer}
#roll:focus-visible{outline:2px solid var(--now);outline-offset:-3px}

/* ---- 下の帯:次に鳴る音 ---- */
/* 色の判別が難しい人への手がかりなので、装飾ではなく主役として大きく出す。 */
.read{
  display:flex;align-items:center;gap:20px;
  height:calc(var(--read) + env(safe-area-inset-bottom));
  padding:0 calc(15px + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(15px + env(safe-area-inset-left));
  border-top:1px solid var(--edge);
}
.next{display:flex;flex-direction:column;gap:3px;min-width:0}
.next .cap{font-size:10.5px;letter-spacing:.15em;color:var(--mute)}
.next .val{display:flex;gap:18px;font-family:var(--mono);font-size:29px;line-height:1.05;
  letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.next .val[data-end="1"]{display:block}
.next .val[data-end="1"]{font-family:var(--sans);font-size:19px;color:var(--mute);letter-spacing:0}
.acts{margin-left:auto;display:flex;gap:8px;flex:none}
.act{padding:11px 15px;border:1px solid var(--edge);border-radius:4px;
  font-size:13px;color:var(--mute)}
.act:hover{color:var(--ink);border-color:var(--edge-hi)}

/* ---- 引き出し:曲と音色 ---- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(6,6,10,.6);
  opacity:0;pointer-events:none;transition:opacity .18s ease}
.scrim[data-open="1"]{opacity:1;pointer-events:auto}
.panel{
  position:fixed;top:0;bottom:0;left:0;z-index:21;
  width:min(346px,88vw);
  background:var(--lift);border-right:1px solid var(--edge);
  display:flex;flex-direction:column;gap:22px;
  padding:calc(20px + env(safe-area-inset-top)) 0 calc(18px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateX(-101%);transition:transform .2s cubic-bezier(.2,.75,.3,1);
}
.panel[data-open="1"]{transform:none}
.panel:focus{outline:none}
.panel:focus-visible{outline:none}
.brand{padding:0 20px 8px}
.mark{margin:0;font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:-.02em}
.close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:12px;
  width:34px;height:34px;font-size:17px;color:var(--mute);line-height:1}
.close:hover{color:var(--ink)}
.sec{display:flex;flex-direction:column}
.sec>.cap{display:flex;font-size:10.5px;letter-spacing:.14em;color:var(--mute);margin:0 20px 9px}
.sec>.cap span:last-child:not(:first-child){margin-left:auto;letter-spacing:.08em}
.song{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  padding:11px 20px 11px 17px;border-left:3px solid transparent;font-size:14px;line-height:1.45}
.song:hover{background:rgba(255,255,255,.035)}
.song[aria-current="true"]{border-left-color:var(--now);background:rgba(245,165,36,.08);font-weight:600}
.song .taps{margin-left:auto;flex:none;font-family:var(--mono);font-size:11px;
  color:var(--mute);font-variant-numeric:tabular-nums}
.tones{display:flex;gap:7px;padding:0 20px}
.tone{flex:1;padding:11px 0;font-size:13px;text-align:center;
  border:1px solid var(--edge);border-radius:4px;color:var(--mute)}
.tone:hover{color:var(--ink)}
.tone[aria-pressed="true"]{border-color:var(--now);color:var(--ink);background:rgba(245,165,36,.09)}
.sfmsg{margin:10px 20px 0;font-size:11.5px;line-height:1.55;color:var(--mute)}
.sfmsg[data-bad="1"]{color:var(--now)}
.sfmsg:empty{display:none}
.file{display:block;margin:0 20px;padding:12px 14px;font-size:12.5px;color:var(--mute);
  border:1px dashed var(--edge);border-radius:4px;cursor:pointer;
  -webkit-appearance:none;appearance:none;touch-action:manipulation}
.file:hover{color:var(--ink);border-color:var(--edge-hi)}
.file input{display:none}

@media (max-width:560px){
  :root{--read:68px}
  .next .val{font-size:24px}
  .title{font-size:14px}
  .act{padding:10px 12px;font-size:12.5px}
  .open span.lbl{display:none}
  .open{padding:9px 11px}
}
@media (prefers-reduced-motion:reduce){
  .panel,.scrim{transition:none}
}
</style>

    g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(peak,t+this.A);
    if(b.decay){
      // 減衰音色はループで途切れさせず、包絡線のほうを落とす
      const d=TONES[tone].d||1.8;
      g.gain.exponentialRampToValueAtTime(.0006,t+this.A+d);
      try{src.stop(t+this.A+d+.2)}catch(e){}
    }
    src.connect(g); g.connect(master); src.start(t);
    live.push({g:g,nodes:[src]});
  },
  load:function(t,done){
    const self=this;
    if(self.state[t]==='ready'){done();return}
    if(self.state[t]==='loading') return;
    self.state[t]='loading'; self.msg[t]=''; done();

    const finish=function(ok,m){ self.state[t]=ok?'ready':'error'; self.msg[t]=m||''; done(); };

    const build=function(){
      const d=DTSF.raw[t];
      if(!d||!d.zones||!d.zones.length){finish(false,'音色データが空です');return}
      const out=[]; let left=d.zones.length;
      const settle=function(){ if(--left) return;
        const good=out.filter(function(z){return z});
        if(!good.length){finish(false,'音声を復号できません');return}
        good.sort(function(a,b){return a.pitch-b.pitch});
        self.banks[t]={decay:!!d.decay,zones:good};
        finish(true);
      };
      const ac=self.decodeCtx();
      if(!ac){finish(false,'この環境では音を復号できません');return}
      d.zones.forEach(function(z,i){
        let bytes, done1=false;
        const ok=function(buf){ if(done1)return; done1=true;
          out[i]={pitch:z.pitch,ls:z.loopStart,le:z.loopEnd,looped:!!z.looped,buf:buf}; settle(); };
        const ng=function(){ if(done1)return; done1=true; settle(); };
        try{
          const bin=atob(z.file); bytes=new Uint8Array(bin.length);
          for(let k=0;k<bin.length;k++) bytes[k]=bin.charCodeAt(k);
        }catch(e){ ng(); return; }
        try{
          const pr=ac.decodeAudioData(bytes.buffer,ok,ng);
          if(pr&&pr.then) pr.then(ok,ng);   // 新しい Safari は Promise も返す
        }catch(e){ ng(); }
      });
    };

    if(DTSF.raw[t]){build();return}
    const sc=document.createElement('script');
    sc.src='sf/'+t+'.js';
    sc.onload=build;
    sc.onerror=function(){finish(false,'sf/'+t+'.js を読み込めません')};
    document.head.appendChild(sc);
  }
};

/* 鳴らすのは SoundFont。読み込みが終わるまでと、失敗したときだけ合成音。
   音が出ないより音質が落ちるほうが良い(仕様書 6 章)。 */
let engine=Synth;
function pickEngine(){ engine=SF.ready(tone)?SF:Synth; }
function noteOn(midi,vel){ engine.noteOn(midi,vel); }

function allOff(){
  const t=ctx?ctx.currentTime:0, r=engine.rel(tone);
  live.forEach(function(v){
    v.g.gain.cancelScheduledValues(t);
    v.g.gain.setValueAtTime(Math.max(v.g.gain.value,.0001),t);
    v.g.gain.exponentialRampToValueAtTime(.0004,t+r);
    v.nodes.forEach(function(n){ try{n.stop(t+r+.05)}catch(e){} });
  });
  live=[];
}

/* ---------- 状態 ---------- */
let song=SONGS[0], idx=0, scroll=0, lo=48, hi=84, held=false;

function pitchRange(s){
  let a=127,b=0;
  s.events.forEach(e=>e.values.forEach(v=>{a=Math.min(a,v);b=Math.max(b,v)}));
  const pad=Math.max(0,(24-(b-a))>>1);
  return [Math.max(0,a-2-pad),Math.min(127,b+2+pad)];
}
function load(s){
  song=s; idx=0; scroll=0; [lo,hi]=pitchRange(s);
  bits.length=0; pops.length=0; sparkIdx=-1;
  if(ctx) allOff();
  document.querySelectorAll('.song').forEach(b=>b.setAttribute('aria-current',String(b.dataset.name===s.name)));
  update();
}

/* ---------- 演奏 ---------- */
function press(){
  if(held) return; held=true;
  audio(); if(ctx.state==='suspended') ctx.resume();
  if(idx>=song.events.length) return;
  allOff();
  const e=song.events[idx];
  e.values.forEach(v=>noteOn(v,(e.velocity==null?100:e.velocity)));
  sparkIdx=idx;          // 次の描画でこのイベントのブロックが弾ける
  idx++; update();
}
function release(){
  if(!held) return; held=false;
  if(!engine.decays(tone)) allOff();
}
function step(n){
  idx=Math.max(0,Math.min(song.events.length,idx+n));
  if(ctx) allOff();
  update();
}

/* ---------- 描画 ---------- */
const cv=document.getElementById('roll'), g2=cv.getContext('2d');
const cs=getComputedStyle(document.documentElement);
const MONO=(cs.getPropertyValue('--mono')||'monospace').trim();
const SANS=(cs.getPropertyValue('--sans')||'sans-serif').trim();
let W=0,H=0,COL=30;
const PLAY=.28;
const still=matchMedia('(prefers-reduced-motion: reduce)');

const wrap=document.getElementById('stagewrap');
function fit(){
  const r=wrap.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2);
  W=Math.round(r.width); H=Math.round(r.height);
  if(W<40||H<40){ requestAnimationFrame(fit); return; }   // レイアウト確定前は測り直す
  cv.width=Math.round(W*d); cv.height=Math.round(H*d);
  g2.setTransform(d,0,0,d,0,0);
  COL=Math.max(18,Math.min(46,W/22));
}
if(window.ResizeObserver) new ResizeObserver(fit).observe(wrap);
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.visualViewport) visualViewport.addEventListener('resize',fit);

/* 音が出たことを目でも確かめられるようにする。
   鳴った瞬間にブロックが弾けて粒が散る(仕様書 8 章「色だけで情報を伝えない」の延長)。

   気をつけていること:
   - 明滅は小さなブロックの周りだけにとどめ、画面全体を光らせない。
     利用者に発作の既往がある場合を考えて、広い面積が短時間に明暗するのを避ける
   - 粒は加算合成にしない。背景との明度差を大きくしすぎない
   - prefers-reduced-motion のときは粒を飛ばさず、その場で淡く光って消えるだけにする */
let sparkIdx=-1;
const bits=[], pops=[];
const BITN=13, BITLIFE=.52, POPLIFE=.30, MAXBIT=120, MAXPOP=24;

function spark(x,y,w,h){
  pops.push({x:x,y:y,w:w,h:h,t:0,calm:still.matches});
  if(pops.length>MAXPOP) pops.splice(0,pops.length-MAXPOP);
  if(still.matches) return;                  // 動きを抑える設定では飛ばさない
  const cx=x+w/2, cy=y+h/2;
  for(let i=0;i<BITN;i++){
    const a=Math.PI*2*(i+Math.random())/BITN, v=105*(.5+Math.random()*.9);
    bits.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.75-32,
               s:2.3+Math.random()*3.6,t:0,life:BITLIFE*(.65+Math.random()*.7),
               ph:Math.random()*6.283,      // またたきの位相をずらす
               star:Math.random()<.5,       // 半分は十字に描いてきらめかせる
               c:i%3});
  }
  // 速く連打されたときに粒が積み上がらないよう頭打ちにする。
  // 描画の負荷だけでなく、明滅する面積が広がるのを抑える意味もある。
  if(bits.length>MAXBIT) bits.splice(0,bits.length-MAXBIT);
}

function drawSparks(dt){
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t+=dt;
    if(p.t>=POPLIFE){ pops.splice(i,1); continue; }
    const k=p.t/POPLIFE;
    if(p.calm){
      // 動かさず、その場で淡く光って消える
      g2.globalAlpha=(1-k)*.55;
      g2.fillStyle='#ffe9b8';
      g2.fillRect(p.x,p.y,p.w,p.h);
    }else{
      // ブロックそのものが白く弾けて、もとの色に戻りながら消える
      const e=1-(1-k)*(1-k), gx=e*3.5;
      g2.globalAlpha=(1-k)*(1-k)*.95;
      g2.fillStyle='#fff6e2';
      g2.fillRect(p.x-gx,p.y-gx,p.w+gx*2,p.h+gx*2);
    }
  }
  for(let i=bits.length-1;i>=0;i--){
    const b=bits[i]; b.t+=dt;
    if(b.t>=b.life){ bits.splice(i,1); continue; }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.vy+=230*dt; b.vx*=.94; b.vy*=.985;
    const k=1-b.t/b.life, sz=b.s*(.45+k*.55);
    const tw=.55+.45*Math.sin(b.t*26+b.ph);          // ちらちらさせる
    g2.globalAlpha=Math.min(1,k*k*1.3*tw);
    g2.fillStyle=b.c===0?'#f5a524':(b.c===1?'#ffe08f':'#fffaf0');
    if(b.star){
      // 十字に描くと点よりきらめいて見える。roundRect は使わない(古い Safari 対策)
      const L=sz*2.7, T=Math.max(1.2,sz*.42);
      g2.fillRect(b.x-L/2,b.y-T/2,L,T);
      g2.fillRect(b.x-T/2,b.y-L/2,T,L);
    }else{
      g2.fillRect(b.x-sz/2,b.y-sz/2,sz,sz);
    }
  }
  g2.globalAlpha=1;
}

function rowH(){return H/(hi-lo+1)}
function yOf(n){return (hi-n)*rowH()}

let lastTs=0;
function draw(ts){
  // 経過時間で動かす。フレーム落ちしても見え方が変わらないように
  const dt=(lastTs&&ts)?Math.min(.05,(ts-lastTs)/1000):0;
  lastTs=ts||0;
  try{ paint(dt); }catch(err){
    g2.setTransform(1,0,0,1,0,0);
    g2.fillStyle='#16212b'; g2.fillRect(0,0,cv.width,cv.height);
    g2.fillStyle='#e6edf2'; g2.font='13px system-ui';
    g2.fillText('描画できません: '+err.message,14,26);
  }
  requestAnimationFrame(draw);
}
function paint(dt){
  if(W<40||H<40){ fit(); return; }
  const rh=rowH(), px=Math.round(W*PLAY), KEY=Math.round(Math.min(40,Math.max(28,W*.035)));
  scroll += still.matches ? (idx-scroll) : (idx-scroll)*.22;
  if(Math.abs(idx-scroll)<.002) scroll=idx;

  g2.clearRect(0,0,W,H);

  // 黒鍵の行に薄い帯を敷き、オクターブの切れ目に線を引く
  for(let n=lo;n<=hi;n++){
    if(BLACK.includes(n%12)){ g2.fillStyle='#1a2530'; g2.fillRect(KEY,yOf(n),W-KEY,rh); }
    if(n%12===0){
      g2.fillStyle='rgba(127,168,184,.13)';
      g2.fillRect(KEY,Math.round(yOf(n)+rh)-.5,W-KEY,1);
    }
  }

  // 左端の鍵盤。白鍵を土台にして黒鍵を左寄りに重ねると実物の見え方になる。
  // 行ごとに白鍵を描くと白が分断されて鍵盤に見えない。
  const BK=Math.round(KEY*.62);
  g2.fillStyle='#c5d0da'; g2.fillRect(0,0,KEY,H);
  for(let n=lo;n<=hi;n++){
    if(!BLACK.includes(n%12)) continue;
    g2.fillStyle='#141a21';
    g2.fillRect(0,yOf(n),BK,rh);
  }
  // 黒鍵が挟まらない白鍵どうし(E|F, B|C)の境目にだけ細い線を入れる
  g2.fillStyle='rgba(20,26,33,.32)';
  for(let n=lo;n<=hi;n++){
    const m=n%12;
    if(m===4||m===11) g2.fillRect(0,Math.round(yOf(n))-.5,KEY,1);
  }
  if(rh>9){
    g2.font='500 9px '+MONO; g2.textBaseline='middle'; g2.textAlign='right';
    for(let n=lo;n<=hi;n++){
      if(n%12!==0) continue;
      g2.fillStyle='#4a5560';
      g2.fillText(nameOf(n),KEY-4,yOf(n)+rh/2);
    }
    g2.textAlign='left';
  }
  g2.fillStyle='rgba(0,0,0,.45)'; g2.fillRect(KEY,0,1,H);

  const from=Math.max(0,Math.floor(scroll-px/COL)-1), to=Math.min(song.events.length,Math.ceil(scroll+(W-px)/COL)+1);
  const cur=idx-1;
  for(let i=from;i<to;i++){
    const x=px+(i-scroll)*COL;
    if(x+COL<KEY) continue;
    const on=i===cur;
    song.events[i].values.forEach(v=>{
      if(v<lo||v>hi) return;
      const w=Math.max(3,COL-3), h=Math.max(3,rh-2);
      g2.fillStyle = on?'#f5a524':(i<cur?'#3a4854':'#7fa8b8');
      if(on){g2.shadowColor='rgba(245,165,36,.55)'; g2.shadowBlur=14;}
      const bx=Math.max(KEY+1,x), bw=x<KEY+1?Math.max(3,w-(KEY+1-x)):w;
      g2.fillRect(bx,yOf(v)+1,bw,h);
      g2.shadowBlur=0;
      if(i===sparkIdx) spark(bx,yOf(v)+1,bw,h);
    });
  }
  sparkIdx=-1;   // 画面に出ていない音でも印は消す。あとで急に弾けないように

  // 「いま」の線。動かないので、この曲を待たせているのはこの線だという印になる
  const done=idx>=song.events.length;
  if(!done){
    const gl=g2.createLinearGradient(px-26,0,px+8,0);
    gl.addColorStop(0,'rgba(245,165,36,0)');
    gl.addColorStop(1,'rgba(245,165,36,.13)');
    g2.fillStyle=gl; g2.fillRect(px-26,0,34,H);
  }
  g2.fillStyle=done?'#3a4854':'#f5a524';
  g2.fillRect(px-1,0,2,H);

  drawSparks(dt);

  if(done){
    g2.fillStyle='rgba(19,19,26,.88)'; g2.fillRect(0,0,W,H);
    g2.textAlign='center'; g2.textBaseline='middle';
    g2.fillStyle='#e9edf2'; g2.font='600 21px '+SANS;
    g2.fillText('おわりました',W/2,H/2-13);
    g2.fillStyle='#8b93a2'; g2.font='13px '+SANS;
    g2.fillText('「最初から」でもう一度',W/2,H/2+15);
    g2.fillStyle='#f5a524';
    g2.fillRect(W/2-14,H/2+38,28,2);
    g2.textAlign='left';
  }
}

const elCount=document.getElementById('count'), elNext=document.getElementById('next'),
      elTitle=document.getElementById('title'), elCap=document.querySelector('.next .cap');
function update(){
  elCount.innerHTML='<b>'+idx+'</b> / '+song.events.length;
  elTitle.textContent=song.name;
  const done=idx>=song.events.length;
  elCap.textContent=done?'演奏':'次の音';
  elNext.dataset.end=done?'1':'0';
  if(done){ elNext.textContent='おわりました'; return; }
  elNext.textContent='';
  song.events[idx].values.forEach(function(v){
    const sp=document.createElement('span'); sp.textContent=nameOf(v); elNext.appendChild(sp);
  });
}

/* ---------- 曲と音色の引き出し ---------- */
/* 演奏中に見えているのは譜面だけでよい。設定は必要なときだけ出す。
   開いている間はスペースを演奏に渡さない。引き出しの中の操作に使うため。 */
const panel=document.getElementById('panel'), scrim=document.getElementById('scrim'),
      opener=document.getElementById('open');
let panelOpen=false;
function openPanel(){
  panelOpen=true;
  panel.dataset.open='1'; scrim.dataset.open='1';
  opener.setAttribute('aria-expanded','true');
  release(); if(ctx) allOff();
  // 器そのものに移す。曲や音色のボタンに乗せると、スイッチ(スペース)を
  // 押したときにそのボタンが実行されてしまう。Tab で中の操作には入れる。
  if(panel.focus) panel.focus();
}
function shut(){
  if(!panelOpen) return;
  panelOpen=false;
  panel.dataset.open='0'; scrim.dataset.open='0';
  opener.setAttribute('aria-expanded','false');
  if(cv.focus) cv.focus();      // 閉じたらすぐ演奏に戻れるようにする
}
opener.onclick=()=>panelOpen?shut():openPanel();
document.getElementById('close').onclick=shut;
scrim.onclick=shut;
addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&panelOpen){ ev.preventDefault(); shut(); } });

/* ---------- 入力 ---------- */
const isGo=ev=>ev.code==='Space'||ev.code==='Enter'||ev.key===' '||ev.key==='Spacebar'||ev.key==='Enter';
addEventListener('keydown',ev=>{
  if(!isGo(ev)) return;
  if(panelOpen) return;
  if(ev.target.tagName==='BUTTON'||ev.target.tagName==='INPUT'||ev.target.tagName==='LABEL') return;
  ev.preventDefault(); if(ev.repeat) return; press();
});
addEventListener('keyup',ev=>{ if(isGo(ev)) release(); });

const go=ev=>{ if(panelOpen) return; if(ev.cancelable) ev.preventDefault(); if(cv.focus) cv.focus(); press(); };
if(window.PointerEvent){
  cv.addEventListener('pointerdown',go);
  addEventListener('pointerup',release);
  addEventListener('pointercancel',release);
}else{
  cv.addEventListener('touchstart',go,{passive:false});
  addEventListener('touchend',release);
  addEventListener('touchcancel',release);
  cv.addEventListener('mousedown',go);
  addEventListener('mouseup',release);
}
// マウスやタップでボタンを押したあとは譜面に焦点を戻す。
// 戻さないとボタンにフォーカスが残り、次のスペース入力がボタンの再実行に
// 吸われて演奏が進まない(Chrome で再現。Safari はボタンに焦点が残らない)。
// 支援者がマウスで「1つ戻す」を押し、本人がスイッチで続ける場面で効く。
// キーボードから起動したとき(ev.detail===0)はタブ移動を壊さないので触らない。
document.addEventListener('click',ev=>{
  if(!ev.detail||panelOpen) return;   // 引き出しの操作中は奪わない
  const t=ev.target;
  const b=(t&&t.closest)?t.closest('button'):null;
  if(b&&cv.focus) cv.focus();
});

// iPadOSの二本指ダブルタップ拡大や長押しメニューを抑える
cv.addEventListener('dblclick',ev=>ev.preventDefault());
cv.addEventListener('contextmenu',ev=>ev.preventDefault());
cv.addEventListener('gesturestart',ev=>ev.preventDefault());
addEventListener('blur',release);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){release(); if(ctx) allOff();} });

/* ---------- 組み立て ---------- */
const list=document.getElementById('songs');
function addSong(s){
  const b=document.createElement('button');
  b.className='song'; b.dataset.name=s.name;
  b.innerHTML='<span class="nm"></span><span class="taps">'+s.events.length+'</span>';
  b.querySelector('.nm').textContent=s.name;
  // 曲を選ぶのは決めの操作なので、選んだら閉じて演奏に戻す
  b.onclick=()=>{ load(s); shut(); };
  list.appendChild(b);
}
SONGS.forEach(addSong);

const tw=document.getElementById('tones');
Object.entries(TONES).forEach(([k,v])=>{
  const b=document.createElement('button');
  b.className='tone'; b.textContent=v.label; b.setAttribute('aria-pressed',String(k===tone));
  b.onclick=()=>setTone(k);   // 聴き比べられるよう引き出しは開いたままにする
  tw.appendChild(b);
});
function setTone(k){
  if(ctx) allOff();
  tone=k;
  [...tw.children].forEach((c,i)=>c.setAttribute('aria-pressed',String(Object.keys(TONES)[i]===k)));
  ensureSF();
}

/* 音源の切替。SoundFont は選ばれた音色の分だけその場で読み込む。
   読めなければ合成音のまま鳴らし続ける(音が出ないより音質が落ちるほうが良い)。 */
const sfmsg=document.getElementById('sfmsg'), elAlert=document.getElementById('alert');
function ensureSF(){ SF.load(tone,sfStatus); pickEngine(); sfStatus(); }
function sfStatus(){
  pickEngine();
  /* うまくいっているときは黙る。読み込み中と失敗だけ伝える(仕様書 8 章)。 */
  let t='', bad='0';
  if(SF.state[tone]==='loading') t=TONES[tone].label+'の音を読み込んでいます。それまでは簡易な音で鳴ります。';
  else if(SF.state[tone]!=='ready'){ t=(SF.msg[tone]||'音を読み込めませんでした')+' 簡易な音で鳴らします。'; bad='1'; }
  sfmsg.textContent=t; sfmsg.dataset.bad=bad;
  // 引き出しが閉じていても失敗に気づけるようにする(仕様書 8 章)
  elAlert.textContent=bad==='1'?'音を読み込めませんでした':'';
  elAlert.dataset.on=bad;
}

document.getElementById('back').onclick=()=>step(-1);
document.getElementById('reset').onclick=()=>{idx=0; if(ctx)allOff(); update()};
document.getElementById('file').onchange=ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d)||!d.length||!Array.isArray(d[0].values)) throw 0;
      const s={name:f.name.replace(/\.json$/i,''),events:d.filter(e=>Array.isArray(e.values)&&e.values.length)};
      SONGS.push(s); addSong(s); load(s); sfStatus(); shut();
    }catch(e){
      sfmsg.textContent='このファイルは読み込めません。タップ演奏データの JSON を選んでください。';
      sfmsg.dataset.bad='1';
    }
  };
  r.readAsText(f);
};

fit(); load(SONGS[0]); ensureSF(); draw();
</script>
