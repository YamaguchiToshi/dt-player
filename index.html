<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>dt-player</title>
<style>
:root{
  --stage:#16212b; --panel:#0f1820; --line:#22313d; --stripe:#1b2832;
  --ink:#e6edf2; --mute:#8da0af; --soon:#7fa8b8; --done:#3a4854; --now:#f5a524;
}
*{box-sizing:border-box}
html{height:100%}
html,body{margin:0}
body{
  position:fixed;inset:0;height:100%;overflow:hidden;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  background:var(--panel);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  font-feature-settings:"palt" 1;
  display:grid;grid-template-columns:248px 1fr;
}
aside{
  background:var(--panel);border-right:1px solid var(--line);
  -webkit-overflow-scrolling:touch;
  padding-left:env(safe-area-inset-left);
  padding:22px 0 16px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;
}
h1{font-size:17px;font-weight:600;letter-spacing:.02em;margin:0 20px 4px}
.sub{font-size:12.5px;line-height:1.6;color:var(--mute);margin:0 20px}
.group{display:flex;flex-direction:column}
.label{font-size:11.5px;color:var(--mute);margin:0 20px 7px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;
  -webkit-appearance:none;appearance:none;border-radius:0;touch-action:manipulation}
.song{
  display:flex;align-items:baseline;gap:8px;width:100%;
  padding:8px 20px 8px 17px;border-left:3px solid transparent;text-align:left;font-size:13.5px;
}
.song:hover{background:var(--stage)}
.song[aria-current="true"]{border-left-color:var(--now);background:var(--stage);font-weight:600}
.song b{font-weight:inherit}
.song i{font-style:normal;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;margin-left:auto}
.tones{display:flex;gap:6px;padding:0 20px}
.tone{flex:1;padding:7px 0;font-size:12.5px;text-align:center;border:1px solid var(--line);border-radius:3px;color:var(--mute)}
.tone[aria-pressed="true"]{border-color:var(--now);color:var(--ink)}
.sfmsg{margin:7px 20px 0;font-size:11.5px;line-height:1.5;color:var(--mute);min-height:1em}
.sfmsg[data-bad="1"]{color:var(--now)}
.file{margin:0 20px;font-size:12.5px;color:var(--mute);border:1px dashed var(--line);border-radius:3px;padding:9px 11px;cursor:pointer;display:block}
.file:hover{color:var(--ink)}
.file input{display:none}
main{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0;background:var(--stage)}
#stagewrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#roll{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.file{-webkit-appearance:none;appearance:none;touch-action:manipulation}
#roll:focus-visible{outline:2px solid var(--now);outline-offset:-2px}
footer{
  border-top:1px solid var(--line);
  padding:11px 22px calc(11px + env(safe-area-inset-bottom)) 22px;
  display:flex;align-items:center;gap:14px;font-size:13px;
}
footer button{border:1px solid var(--line);border-radius:3px;padding:6px 13px;font-size:12.5px;color:var(--mute)}
footer button:hover{color:var(--ink);border-color:var(--soon)}
#count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mute)}
#count b{color:var(--ink);font-weight:600;font-size:15px}
#hint{color:var(--mute);font-size:12.5px}
@supports (height:100dvh){body{height:100dvh}}
@media (max-width:834px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);max-height:42vh}
  main{min-height:58vh}
}
</style>

<aside>
  <div>
    <h1>dt-player</h1>
    <p class="sub">スペースキーか画面のタップで1音ずつ進みます。押している間だけ音が伸びます。</p>
  </div>
  <div class="group">
    <p class="label">曲</p>
    <div id="songs"></div>
  </div>
  <div class="group">
    <p class="label">音色</p>
    <div class="tones" id="tones"></div>
  </div>
  <div class="group">
    <p class="label">音源</p>
    <div class="tones" id="engines"></div>
    <p class="sfmsg" id="sfmsg"></p>
  </div>
  <div class="group">
    <p class="label">自分で作ったデータ</p>
    <label class="file">JSONファイルを選ぶ<input type="file" id="file" accept=".json,application/json,text/json,text/plain"></label>
  </div>
</aside>

  const r=wrap.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2);
  W=Math.round(r.width); H=Math.round(r.height);
  if(W<40||H<40){ requestAnimationFrame(fit); return; }   // レイアウト確定前は測り直す
  cv.width=Math.round(W*d); cv.height=Math.round(H*d);
  g2.setTransform(d,0,0,d,0,0);
  COL=Math.max(18,Math.min(46,W/22));
}
if(window.ResizeObserver) new ResizeObserver(fit).observe(wrap);
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.visualViewport) visualViewport.addEventListener('resize',fit);

function rowH(){return H/(hi-lo+1)}
function yOf(n){return (hi-n)*rowH()}

function draw(){
  try{ paint(); }catch(err){
    g2.setTransform(1,0,0,1,0,0);
    g2.fillStyle='#16212b'; g2.fillRect(0,0,cv.width,cv.height);
    g2.fillStyle='#e6edf2'; g2.font='13px system-ui';
    g2.fillText('描画できません: '+err.message,14,26);
  }
  requestAnimationFrame(draw);
}
function paint(){
  if(W<40||H<40){ fit(); return; }
  const rh=rowH(), px=Math.round(W*PLAY), KEY=30;
  scroll += still.matches ? (idx-scroll) : (idx-scroll)*.22;
  if(Math.abs(idx-scroll)<.002) scroll=idx;

  g2.clearRect(0,0,W,H);

  for(let n=lo;n<=hi;n++){
    if(BLACK.includes(n%12)){ g2.fillStyle='#1b2832'; g2.fillRect(KEY,yOf(n),W-KEY,rh); }
    if(n%12===0){ g2.strokeStyle='#22313d'; g2.lineWidth=1; g2.beginPath(); g2.moveTo(KEY,yOf(n)+rh); g2.lineTo(W,yOf(n)+rh); g2.stroke(); }
  }

  for(let n=lo;n<=hi;n++){
    const b=BLACK.includes(n%12);
    g2.fillStyle=b?'#0f1820':'#cfdae2';
    g2.fillRect(0,yOf(n)+.5,b?KEY*.62:KEY,rh-1);
    if(n%12===0&&rh>9){
      g2.fillStyle='#6b7c8a'; g2.font='9px system-ui'; g2.textBaseline='middle';
      g2.fillText(nameOf(n),KEY-19,yOf(n)+rh/2);
    }
  }
  g2.strokeStyle='#22313d'; g2.beginPath(); g2.moveTo(KEY+.5,0); g2.lineTo(KEY+.5,H); g2.stroke();

  const from=Math.max(0,Math.floor(scroll-px/COL)-1), to=Math.min(song.events.length,Math.ceil(scroll+(W-px)/COL)+1);
  const cur=idx-1;
  for(let i=from;i<to;i++){
    const x=px+(i-scroll)*COL;
    if(x+COL<KEY) continue;
    const on=i===cur;
    song.events[i].values.forEach(v=>{
      if(v<lo||v>hi) return;
      const w=Math.max(3,COL-3), h=Math.max(3,rh-2);
      g2.fillStyle = on?'#f5a524':(i<cur?'#3a4854':'#7fa8b8');
      if(on){g2.shadowColor='rgba(245,165,36,.55)'; g2.shadowBlur=14;}
      const bx=Math.max(KEY+1,x), bw=x<KEY+1?Math.max(3,w-(KEY+1-x)):w;
      g2.fillRect(bx,yOf(v)+1,bw,h);
      g2.shadowBlur=0;
    });
  }

  g2.strokeStyle=idx>=song.events.length?'#3a4854':'#f5a524';
  g2.lineWidth=2; g2.beginPath(); g2.moveTo(px,0); g2.lineTo(px,H); g2.stroke();

  if(idx>=song.events.length){
    g2.fillStyle='rgba(15,24,32,.82)'; g2.fillRect(0,H/2-34,W,68);
    g2.fillStyle='#e6edf2'; g2.font='600 19px system-ui'; g2.textAlign='center'; g2.textBaseline='middle';
    g2.fillText('おわり',W/2,H/2-6);
    g2.fillStyle='#8da0af'; g2.font='13px system-ui';
    g2.fillText('「最初から」でもう一度',W/2,H/2+18);
    g2.textAlign='left';
  }
}

function update(){
  document.getElementById('count').innerHTML='<b>'+idx+'</b> / '+song.events.length;
  const e=song.events[idx];
  document.getElementById('hint').textContent =
    idx>=song.events.length ? '演奏おわり' : '次の音　'+e.values.map(nameOf).join('  ');
}

/* ---------- 入力 ---------- */
const isGo=ev=>ev.code==='Space'||ev.code==='Enter'||ev.key===' '||ev.key==='Spacebar'||ev.key==='Enter';
addEventListener('keydown',ev=>{
  if(!isGo(ev)) return;
  if(ev.target.tagName==='BUTTON'||ev.target.tagName==='INPUT'||ev.target.tagName==='LABEL') return;
  ev.preventDefault(); if(ev.repeat) return; press();
});
addEventListener('keyup',ev=>{ if(isGo(ev)) release(); });

const go=ev=>{ if(ev.cancelable) ev.preventDefault(); if(cv.focus) cv.focus(); press(); };
if(window.PointerEvent){
  cv.addEventListener('pointerdown',go);
  addEventListener('pointerup',release);
  addEventListener('pointercancel',release);
}else{
  cv.addEventListener('touchstart',go,{passive:false});
  addEventListener('touchend',release);
  addEventListener('touchcancel',release);
  cv.addEventListener('mousedown',go);
  addEventListener('mouseup',release);
}
// マウスやタップでボタンを押したあとは譜面に焦点を戻す。
// 戻さないとボタンにフォーカスが残り、次のスペース入力がボタンの再実行に
// 吸われて演奏が進まない(Chrome で再現。Safari はボタンに焦点が残らない)。
// 支援者がマウスで「1つ戻す」を押し、本人がスイッチで続ける場面で効く。
// キーボードから起動したとき(ev.detail===0)はタブ移動を壊さないので触らない。
document.addEventListener('click',ev=>{
  if(!ev.detail) return;
  const t=ev.target;
  const b=(t&&t.closest)?t.closest('button'):null;
  if(b&&cv.focus) cv.focus();
});

// iPadOSの二本指ダブルタップ拡大や長押しメニューを抑える
cv.addEventListener('dblclick',ev=>ev.preventDefault());
cv.addEventListener('contextmenu',ev=>ev.preventDefault());
cv.addEventListener('gesturestart',ev=>ev.preventDefault());
addEventListener('blur',release);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){release(); if(ctx) allOff();} });

/* ---------- 組み立て ---------- */
const list=document.getElementById('songs');
function addSong(s){
  const b=document.createElement('button');
  b.className='song'; b.dataset.name=s.name;
  b.innerHTML='<b></b><i>'+s.events.length+' タップ</i>';
  b.querySelector('b').textContent=s.name;
  b.onclick=()=>load(s);
  list.appendChild(b);
}
SONGS.forEach(addSong);

const tw=document.getElementById('tones');
Object.entries(TONES).forEach(([k,v])=>{
  const b=document.createElement('button');
  b.className='tone'; b.textContent=v.label; b.setAttribute('aria-pressed',String(k===tone));
  b.onclick=()=>setTone(k);
  tw.appendChild(b);
});
function setTone(k){
  if(ctx) allOff();
  tone=k;
  [...tw.children].forEach((c,i)=>c.setAttribute('aria-pressed',String(Object.keys(TONES)[i]===k)));
  ensureSF();
}

/* 音源の切替。SoundFont は選ばれた音色の分だけその場で読み込む。
   読めなければ合成音のまま鳴らし続ける(音が出ないより音質が落ちるほうが良い)。 */
const ew=document.getElementById('engines'), sfmsg=document.getElementById('sfmsg');
[['synth','合成音'],['sf','SoundFont']].forEach(([k,label])=>{
  const b=document.createElement('button');
  b.className='tone'; b.textContent=label; b.dataset.engine=k;
  b.setAttribute('aria-pressed',String((k==='sf')===wantSF));
  b.onclick=()=>{ wantSF=(k==='sf'); if(ctx) allOff(); ensureSF(); };
  ew.appendChild(b);
});
function ensureSF(){
  [...ew.children].forEach(c=>c.setAttribute('aria-pressed',String((c.dataset.engine==='sf')===wantSF)));
  if(wantSF){ audio(); SF.load(tone,sfStatus); }
  pickEngine(); sfStatus();
}
function sfStatus(){
  pickEngine();
  let t='', bad='0';
  if(!wantSF) t='合成音で鳴らします。読み込みを待たずにすぐ鳴ります。';
  else if(SF.state[tone]==='loading') t=TONES[tone].label+'の音を読み込んでいます…';
  else if(SF.state[tone]==='ready') t=TONES[tone].label+'は SoundFont で鳴ります。';
  else { t=(SF.msg[tone]||'音を読み込めませんでした')+' 合成音で鳴らします。'; bad='1'; }
  sfmsg.textContent=t; sfmsg.dataset.bad=bad;
}

document.getElementById('back').onclick=()=>step(-1);
document.getElementById('reset').onclick=()=>{idx=0; if(ctx)allOff(); update()};
document.getElementById('file').onchange=ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d)||!d.length||!Array.isArray(d[0].values)) throw 0;
      const s={name:f.name.replace(/\.json$/i,''),events:d.filter(e=>Array.isArray(e.values)&&e.values.length)};
      SONGS.push(s); addSong(s); load(s);
    }catch(e){
      document.getElementById('hint').textContent='このファイルは読み込めません。タップ演奏データのJSONを選んでください。';
    }
  };
  r.readAsText(f);
};

fit(); load(SONGS[0]); sfStatus(); draw();
</script>
