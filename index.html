<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>dt-player</title>
<style>
:root{
  /* 画面まわりは中性の暗色にし、色温度を持たせるのは譜面だけにする。
     そうすると譜面が「光っている面」として浮き上がる。 */
  --chrome:#13131a;
  --lift:#1a1a23;
  --edge:#2b2b36;
  --edge-hi:#3d3d4b;
  --stage:#141d25;
  --lane:#1a2530;
  --ink:#e9edf2;
  --mute:#8b93a2;
  --wait:#7fa8b8;   /* これから鳴る音 */
  --past:#3a4854;   /* 鳴った音 */
  --now:#f5a524;    /* いま鳴っている音 */
  /* 日本語は本文用のゴシック、音名と数字は等幅。楽器の状態表示と
     人への説明を書き分ける。webフォントは読み込まない(回線のため)。 */
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --bar:54px;
  --read:76px;
}
*{box-sizing:border-box}
html{height:100%}
html,body{margin:0}
body{
  position:fixed;inset:0;height:100%;overflow:hidden;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  background:var(--chrome);color:var(--ink);
  font-family:var(--sans);font-feature-settings:"palt" 1;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
}
@supports (height:100dvh){body{height:100dvh}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;
  -webkit-appearance:none;appearance:none;border-radius:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--now);outline-offset:2px}

/* ---- 上の帯:いま何を弾いているか ---- */
.top{
  display:flex;align-items:center;gap:13px;
  height:calc(var(--bar) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) calc(15px + env(safe-area-inset-right)) 0 calc(15px + env(safe-area-inset-left));
  border-bottom:1px solid var(--edge);
}
.open{
  display:flex;align-items:center;gap:9px;flex:none;
  padding:8px 14px 8px 11px;border:1px solid var(--edge);border-radius:4px;
  font-size:13px;color:var(--mute);
}
.open:hover{color:var(--ink);border-color:var(--edge-hi)}
.bars{display:flex;flex-direction:column;gap:3px;width:13px;flex:none}
.bars i{display:block;height:1.5px;background:currentColor}
.title{font-size:15px;font-weight:600;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.alert{margin:0;font-size:12px;color:var(--now);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
.alert[data-on="0"]{display:none}
.count{margin-left:auto;flex:none;font-family:var(--mono);font-size:12px;
  color:var(--mute);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.count b{color:var(--ink);font-weight:600;font-size:17px}

/* ---- 譜面 ---- */
/* Safari のグリッド行では height:100% が 0 になるので、relative の器に
   absolute で広げる。サイズは器の getBoundingClientRect() から取る。 */
#stagewrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--stage)}
#roll{position:absolute;top:0;left:0;width:100%;height:100%;display:block;
  touch-action:none;cursor:pointer}
#roll:focus-visible{outline:2px solid var(--now);outline-offset:-3px}

/* ---- 下の帯:次に鳴る音 ---- */
/* 色の判別が難しい人への手がかりなので、装飾ではなく主役として大きく出す。 */
.read{
  display:flex;align-items:center;gap:20px;
  height:calc(var(--read) + env(safe-area-inset-bottom));
  padding:0 calc(15px + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(15px + env(safe-area-inset-left));
  border-top:1px solid var(--edge);
}
.next{display:flex;flex-direction:column;gap:3px;min-width:0}
.next .cap{font-size:10.5px;letter-spacing:.15em;color:var(--mute)}
.next .val{display:flex;gap:18px;font-family:var(--mono);font-size:29px;line-height:1.05;
  letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.next .val[data-end="1"]{display:block}
.next .val[data-end="1"]{font-family:var(--sans);font-size:19px;color:var(--mute);letter-spacing:0}
.acts{margin-left:auto;display:flex;gap:8px;flex:none}
.act{padding:11px 15px;border:1px solid var(--edge);border-radius:4px;
  font-size:13px;color:var(--mute)}
.act:hover{color:var(--ink);border-color:var(--edge-hi)}
.act.warn{color:var(--now);border-color:var(--now)}
.act[data-on="0"]{display:none}

/* ---- 引き出し:曲と音色 ---- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(6,6,10,.6);
  opacity:0;pointer-events:none;transition:opacity .18s ease}
.scrim[data-open="1"]{opacity:1;pointer-events:auto}
.panel{
  position:fixed;top:0;bottom:0;left:0;z-index:21;
  width:min(346px,88vw);
  background:var(--lift);border-right:1px solid var(--edge);
  display:flex;flex-direction:column;gap:22px;
  padding:calc(20px + env(safe-area-inset-top)) 0 calc(18px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateX(-101%);transition:transform .2s cubic-bezier(.2,.75,.3,1);
}
.panel[data-open="1"]{transform:none}
.panel:focus{outline:none}
.panel:focus-visible{outline:none}
.brand{padding:0 20px 8px}
.mark{margin:0;font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:-.02em}
.close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:12px;
  width:34px;height:34px;font-size:17px;color:var(--mute);line-height:1}
.close:hover{color:var(--ink)}
.sec{display:flex;flex-direction:column}
.sec>.cap{display:flex;font-size:10.5px;letter-spacing:.14em;color:var(--mute);margin:0 20px 9px}
.sec>.cap span:last-child:not(:first-child){margin-left:auto;letter-spacing:.08em}
.row{display:flex;align-items:stretch;border-left:3px solid transparent}
.row:hover{background:rgba(255,255,255,.035)}
.row[data-current="1"]{border-left-color:var(--now);background:rgba(245,165,36,.08)}
.row[data-current="1"] .song{font-weight:600}
.song{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0;text-align:left;
  padding:11px 6px 11px 14px;font-size:14px;line-height:1.45}
.song .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song .taps{margin-left:auto;flex:none;font-family:var(--mono);font-size:11px;
  color:var(--mute);font-variant-numeric:tabular-nums}
.dl{display:flex;align-items:center;justify-content:center;flex:none;width:42px;
  color:var(--mute);text-decoration:none;font-size:15px;line-height:1}
.dl:hover{color:var(--now)}
.hintline{margin:10px 20px 0;font-size:11px;line-height:1.5;color:var(--mute)}
.tones{display:flex;gap:7px;padding:0 20px}
.tone{flex:1;padding:11px 0;font-size:13px;text-align:center;
  border:1px solid var(--edge);border-radius:4px;color:var(--mute)}
.tone:hover{color:var(--ink)}
.tone[aria-pressed="true"]{border-color:var(--now);color:var(--ink);background:rgba(245,165,36,.09)}
.sfmsg{margin:10px 20px 0;font-size:11.5px;line-height:1.55;color:var(--mute)}
.sfmsg[data-bad="1"]{color:var(--now)}
.sfmsg:empty{display:none}
.file{display:block;margin:0 20px;padding:12px 14px;font-size:12.5px;color:var(--mute);
  border:1px dashed var(--edge);border-radius:4px;cursor:pointer;
  -webkit-appearance:none;appearance:none;touch-action:manipulation}
.file:hover{color:var(--ink);border-color:var(--edge-hi)}
.file input{display:none}

@media (max-width:560px){
  :root{--read:68px}
  .next .val{font-size:24px}
  .title{font-size:14px}
  .act{padding:10px 12px;font-size:12.5px}
  .open span.lbl{display:none}
  .open{padding:9px 11px}
}
@media (prefers-reduced-motion:reduce){
  .panel,.scrim{transition:none}
}
</style>

<div class="top">
  <button class="open" id="open" aria-expanded="false" aria-controls="panel">
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="lbl">曲と音色</span>
  </button>
  <p class="title" id="title">きらきら星</p>
  <p class="alert" id="alert" data-on="0"></p>
  <p class="count" id="count"><b>0</b> / 0</p>
</div>

<audio id="keepalive" loop playsinline preload="auto" src="data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YZABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"></audio>

<div id="stagewrap"><canvas id="roll" tabindex="0" aria-label="ピアノロール"></canvas></div>

<div class="read">
  <div class="next">
    <span class="cap">次の音</span>
    <span class="val" id="next">—</span>
  </div>
  <div class="acts">
    <button class="act warn" id="retry" data-on="0">再試行</button>
    <button class="act" id="back">1つ戻す</button>
    <button class="act" id="reset">最初から</button>
  </div>
</div>

<div class="scrim" id="scrim" data-open="0"></div>
<aside class="panel" id="panel" data-open="0" aria-label="曲と音色" role="dialog" aria-modal="true" tabindex="-1">
  <button class="close" id="close" aria-label="閉じる">✕</button>
  <div class="brand">
    <p class="mark">dt-player</p>
  </div>
  <div class="sec">
    <p class="cap"><span>曲</span><span>タップ数</span></p>
    <div id="songs"></div>
    <p class="hintline">↓ でその曲のデータを保存できます。</p>
    <p class="sfmsg" id="songmsg" data-bad="0"></p>
  </div>
  <div class="sec">
    <p class="cap">音色</p>
    <div class="tones" id="tones"></div>
    <p class="sfmsg" id="sfmsg" data-bad="0"></p>
  </div>
  <div class="sec">
    <p class="cap">自分で作ったデータ</p>
    <label class="file">JSONファイルを選ぶ<input type="file" id="file" accept=".json,application/json,text/json,text/plain"></label>
  </div>
</aside>

<script></script>
<script>
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const BLACK=[1,3,6,8,10];
const nameOf=n=>NAMES[n%12]+(Math.floor(n/12)-1);

/* ---------- 音 ---------- */
/* 音源は2実装ある。共通の約束は3つだけ。
     noteOn(midi, velocity)  1音鳴らす
     decays(音色)            押しっぱなしでも減衰する音色か
     rel(音色)               離してから消えるまでの秒数
   減衰しない音色は離すまで伸ばす。これはこのアプリの表現の核なので、
   どちらの実装でも崩さない(仕様書 8 章)。 */
const TONES={
  organ:{label:'オルガン',osc:'sine',parts:[[1,1],[2,.45],[4,.2]],a:.012,d:0,r:.14,cut:4200,gain:.85,wet:.34,sr:.20},
  piano:{label:'ピアノ',osc:'triangle',parts:[[1,1],[2,.3]],a:.004,d:1.8,r:.18,cut:5200,gain:1,wet:.28,sr:.18},
  strings:{label:'ストリングス',osc:'sawtooth',parts:[[.997,.5],[1.003,.5],[2,.12]],a:.16,d:0,r:.5,cut:2300,gain:.7,wet:.36,sr:.40}
};
let tone='organ', ctx=null, master=null, wetGain=null, live=[];

/* 部屋の響きを作る。
   スイッチひとつで弾く以上、離してから次を押すまでのあいだは必ず無音になる。
   実際の楽器はそこを部屋の反射音が埋めていて、切れ切れには聞こえない。
   ここで足しているのはその空間。押している間だけ音が伸びるという約束は変えない。

   音源ファイルを増やしたくないので、インパルス応答はその場で作る。
   雑音を指数で減衰させ、時間が経つほど高域を丸める(実際の部屋では
   高い音のほうが早く減る)。 */
function setWet(v,sec){
  if(!wetGain||!ctx) return;
  const t=ctx.currentTime;
  wetGain.gain.cancelScheduledValues(t);
  wetGain.gain.setValueAtTime(wetGain.gain.value,t);
  wetGain.gain.linearRampToValueAtTime(v,t+(sec||.12));
}

function makeRoom(ac,secs,decay,damp){
  const rate=ac.sampleRate, len=Math.max(1,Math.floor(rate*secs));
  const buf=ac.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    let lp=0;
    for(let i=0;i<len;i++){
      const t=i/len;
      lp += ((Math.random()*2-1)-lp)*(damp*(1-t*.72));
      d[i]=lp*Math.pow(1-t,decay);
    }
  }
  return buf;
}

function audio(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
    master=ctx.createGain(); master.gain.value=.22;
    // 直接音はそのまま、脇に響きを分岐させる
    master.connect(ctx.destination);
    try{
      const conv=ctx.createConvolver();
      conv.buffer=makeRoom(ctx,1.9,2.6,.30);
      wetGain=ctx.createGain(); wetGain.gain.value=TONES[tone].wet;
      master.connect(conv); conv.connect(wetGain); wetGain.connect(ctx.destination);
    }catch(e){ wetGain=null; }   // 響きが作れなくても演奏は続ける
    // iPadOS Safari:最初のタップで無音を1つ鳴らして音声出力を解錠する
    const b=ctx.createBufferSource();
    b.buffer=ctx.createBuffer(1,1,ctx.sampleRate); b.connect(ctx.destination); b.start(0);
    const ka=document.getElementById('keepalive');
    if(ka){ka.volume=0.001; const p=ka.play(); if(p&&p.catch) p.catch(()=>{});}
  }
  if(ctx.state!=='running'&&ctx.resume) ctx.resume();
  return ctx;
}

/* 合成音(既定。読み込むものがなく必ず鳴る) */
const Synth={
  decays:function(t){return TONES[t].d>0},
  rel:function(t){return TONES[t].r},
  noteOn:function(midi,vel){
    const T=TONES[tone], t=ctx.currentTime, f=440*Math.pow(2,(midi-69)/12);
    const g=ctx.createGain(), lp=ctx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=T.cut;
    g.connect(lp); lp.connect(master);
    const peak=T.gain*Math.max(.15,vel/127);
    g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(peak,t+T.a);
    if(T.d>0) g.gain.exponentialRampToValueAtTime(.0006,t+T.a+T.d);
    const nodes=T.parts.map(function(p){
      const o=ctx.createOscillator(), og=ctx.createGain();
      o.type=T.osc; o.frequency.value=f*p[0]; og.gain.value=p[1];
      o.connect(og); og.connect(g); o.start(t); return o;
    });
    live.push({g:g,nodes:nodes});
  }
};

/* SoundFont。sf/<音色>.js が DTSF.add() で自分を渡してくる。
   base64 の MP3 を decodeAudioData に通し、ループ点で伸ばす。
   ループ情報があるから押している間ずっと鳴らせる(仕様書 6 章)。 */
const DTSF={raw:{},add:function(id,d){this.raw[id]=d}};
window.DTSF=DTSF;

const SF={
  banks:{}, state:{}, msg:{}, A:.012, dctx:null,
  /* 復号だけなら操作(タップ)を待たなくてよい。AudioContext がまだ無い間は
     OfflineAudioContext を使い、開いた直後から先読みを始める。
     こうしないと最初の一音までに読み込みを待たせることになる。 */
  decodeCtx:function(){
    if(ctx) return ctx;
    if(!this.dctx){
      const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
      if(!OC) return null;
      try{ this.dctx=new OC(1,1,44100); }catch(e){ return null; }
    }
    return this.dctx;
  },
  ready:function(t){return this.state[t]==='ready'},
  decays:function(t){const b=this.banks[t]; return b?b.decay:TONES[t].d>0},
  rel:function(t){return this.decays(t)?TONES[t].r:TONES[t].sr},
  noteOn:function(midi,vel){
    const b=this.banks[tone];
    if(!b){Synth.noteOn(midi,vel);return}          // 念のための保険
    let z=b.zones[0];
    for(let i=1;i<b.zones.length;i++){
      if(Math.abs(b.zones[i].pitch-midi)<Math.abs(z.pitch-midi)) z=b.zones[i];
    }
    const t=ctx.currentTime, g=ctx.createGain(), src=ctx.createBufferSource();
    src.buffer=z.buf;
    src.playbackRate.value=Math.pow(2,(midi-z.pitch)/12);   // 間引いた分をここで補う
    if(z.looped){ src.loop=true; src.loopStart=z.ls; src.loopEnd=z.le; }
    const peak=Math.max(.15,vel/127);
    g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(peak,t+this.A);
    if(b.decay){
      // 減衰音色はループで途切れさせず、包絡線のほうを落とす
      const d=TONES[tone].d||1.8;
      g.gain.exponentialRampToValueAtTime(.0006,t+this.A+d);
      try{src.stop(t+this.A+d+.2)}catch(e){}
    }
    src.connect(g); g.connect(master); src.start(t);
    live.push({g:g,nodes:[src]});
  },
  load:function(t,done){
    const self=this;
    if(self.state[t]==='ready'){done();return}
    if(self.state[t]==='loading') return;
    self.state[t]='loading'; self.msg[t]=''; done();

    const finish=function(ok,m){ self.state[t]=ok?'ready':'error'; self.msg[t]=m||''; done(); };

    const build=function(){
      const d=DTSF.raw[t];
      if(!d||!d.zones||!d.zones.length){finish(false,'音色データが空です');return}
      const out=[]; let left=d.zones.length;
      const settle=function(){ if(--left) return;
        const good=out.filter(function(z){return z});
        if(!good.length){finish(false,'音声を復号できません');return}
        good.sort(function(a,b){return a.pitch-b.pitch});
        self.banks[t]={decay:!!d.decay,zones:good};
        finish(true);
      };
      const ac=self.decodeCtx();
      if(!ac){finish(false,'この環境では音を復号できません');return}
      d.zones.forEach(function(z,i){
        let bytes, done1=false;
        const ok=function(buf){ if(done1)return; done1=true;
          out[i]={pitch:z.pitch,ls:z.loopStart,le:z.loopEnd,looped:!!z.looped,buf:buf}; settle(); };
        const ng=function(){ if(done1)return; done1=true; settle(); };
        try{
          const bin=atob(z.file); bytes=new Uint8Array(bin.length);
          for(let k=0;k<bin.length;k++) bytes[k]=bin.charCodeAt(k);
        }catch(e){ ng(); return; }
        try{
          const pr=ac.decodeAudioData(bytes.buffer,ok,ng);
          if(pr&&pr.then) pr.then(ok,ng);   // 新しい Safari は Promise も返す
        }catch(e){ ng(); }
      });
    };

    if(DTSF.raw[t]){build();return}
    const sc=document.createElement('script');
    sc.src='sf/'+t+'.js';
    sc.onload=build;
    sc.onerror=function(){finish(false,'sf/'+t+'.js を読み込めません')};
    document.head.appendChild(sc);
  }
};

/* 鳴らすのは SoundFont。読み込みが終わるまでと、失敗したときだけ合成音。
   音が出ないより音質が落ちるほうが良い(仕様書 6 章)。 */
let engine=Synth;
function pickEngine(){ engine=SF.ready(tone)?SF:Synth; }
function noteOn(midi,vel){ engine.noteOn(midi,vel); }

function allOff(){
  const t=ctx?ctx.currentTime:0, r=engine.rel(tone);
  live.forEach(function(v){
    v.g.gain.cancelScheduledValues(t);
    v.g.gain.setValueAtTime(Math.max(v.g.gain.value,.0001),t);
    v.g.gain.exponentialRampToValueAtTime(.0004,t+r);
    v.nodes.forEach(function(n){ try{n.stop(t+r+.05)}catch(e){} });
  });
  live=[];
}

/* ---------- 曲データ ---------- */
/* 曲は data/songs.json(一覧)と data/songs/*.json(本体)に分けてある。
   目的は2つ(仕様書 5 章)。
     - 曲を足すときに HTML を触らずに済む
     - 個別ファイルをそのまま iPad アプリ用に保存できる
   後者があるので本体は「余計な入れ物を被せない素の配列」にしてある。
   fetch を使うため file:// で直接開くと読めない。黙って止まらず理由を出す。 */
const Songs={
  list:[], cache:{},
  get:function(url){
    // file:// では fetch が必ず失敗し、ブラウザが余計な警告も出す。
    // 投げる前に断って、すぐ理由を見せる。
    if(location.protocol==='file:')
      return Promise.reject(new Error('file'));
    return fetch(url,{cache:'no-cache'}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    });
  },
  why:function(err){
    if(location.protocol==='file:')
      return 'ファイルを直接開くと曲データを読み込めません。公開されている URL を開くか、このフォルダを簡易サーバで配信してください。';
    return '曲データを読み込めませんでした。'+((err&&err.message)?'（'+err.message+'）':'');
  }
};

/* 読み込んだデータが演奏できる形かを確かめる。
   iPad に入れる前の試聴・検証がこのアプリの用途なので、
   壊れたデータを黙って受け取らない。 */
function validate(d){
  if(!Array.isArray(d)) throw new Error('イベントの配列ではありません');
  const ev=d.filter(function(e){ return e&&Array.isArray(e.values)&&e.values.length; });
  if(!ev.length) throw new Error('values を持つイベントがありません');
  return ev;
}
/* 音域外は落とさず、鳴らさないだけにして知らせる(仕様書 2 章) */
function outOfRange(ev){
  const bad={};
  ev.forEach(function(e){ e.values.forEach(function(v){ if(v<48||v>84) bad[v]=1; }); });
  return Object.keys(bad).map(Number).sort(function(a,b){return a-b});
}

/* ---------- 状態 ---------- */
let song=null, idx=0, scroll=0, lo=48, hi=84, held=false;
let stage='loading', stageMsg='読み込んでいます', pending=null;

function pitchRange(s){
  let a=127,b=0;
  s.events.forEach(e=>e.values.forEach(v=>{a=Math.min(a,v);b=Math.max(b,v)}));
  if(a>b){a=48;b=84}
  const pad=Math.max(0,(24-(b-a))>>1);
  return [Math.max(0,a-2-pad),Math.min(127,b+2+pad)];
}
function setStage(kind,msg){
  stage=kind; stageMsg=msg||'';
  if(elRetry) elRetry.dataset.on=(kind==='error')?'1':'0';
  update();
}
function apply(meta,events){
  song={name:meta.title,events:events,id:meta.id};
  idx=0; scroll=0; [lo,hi]=pitchRange(song);
  bits.length=0; pops.length=0; sparkIdx=-1;
  if(ctx) allOff();
  markCurrent(meta.id);
  setStage('','');
  warnRange(events);
}
function choose(meta){
  pending=meta;
  if(Songs.cache[meta.id]){ apply(meta,Songs.cache[meta.id]); return; }
  setStage('loading', meta.title+' を読み込んでいます');
  Songs.get('data/'+meta.file).then(function(d){
    const ev=validate(d);
    Songs.cache[meta.id]=ev;
    if(pending===meta) apply(meta,ev);
  }).catch(function(e){
    if(pending===meta) setStage('error', Songs.why(e));
  });
}
function boot(){
  setStage('loading','曲の一覧を読み込んでいます');
  Songs.get('data/songs.json').then(function(d){
    if(!d||!Array.isArray(d.songs)||!d.songs.length) throw new Error('一覧が空です');
    Songs.list=d.songs.slice();
    buildList();
    choose(Songs.list[0]);
  }).catch(function(e){
    Songs.list=[]; buildList();
    setStage('error', Songs.why(e));
  });
}

/* ---------- 演奏 ---------- */
function press(){
  if(held) return; held=true;
  if(!song) return;
  audio(); if(ctx.state==='suspended') ctx.resume();
  if(idx>=song.events.length) return;
  allOff();
  const e=song.events[idx];
  e.values.forEach(v=>noteOn(v,(e.velocity==null?100:e.velocity)));
  sparkIdx=idx;          // 次の描画でこのイベントのブロックが弾ける
  idx++; update();
}
function release(){
  if(!held) return; held=false;
  if(!engine.decays(tone)) allOff();
}
function step(n){
  if(!song) return;
  idx=Math.max(0,Math.min(song.events.length,idx+n));
  if(ctx) allOff();
  update();
}

/* ---------- 描画 ---------- */
const cv=document.getElementById('roll'), g2=cv.getContext('2d');
const cs=getComputedStyle(document.documentElement);
const MONO=(cs.getPropertyValue('--mono')||'monospace').trim();
const SANS=(cs.getPropertyValue('--sans')||'sans-serif').trim();
let W=0,H=0,COL=30;
const PLAY=.28;
const still=matchMedia('(prefers-reduced-motion: reduce)');

const wrap=document.getElementById('stagewrap');
function fit(){
  const r=wrap.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2);
  W=Math.round(r.width); H=Math.round(r.height);
  if(W<40||H<40){ requestAnimationFrame(fit); return; }   // レイアウト確定前は測り直す
  cv.width=Math.round(W*d); cv.height=Math.round(H*d);
  g2.setTransform(d,0,0,d,0,0);
  COL=Math.max(18,Math.min(46,W/22));
}
if(window.ResizeObserver) new ResizeObserver(fit).observe(wrap);
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.visualViewport) visualViewport.addEventListener('resize',fit);

/* 音が出たことを目でも確かめられるようにする。
   鳴った瞬間にブロックが弾けて粒が散る(仕様書 8 章「色だけで情報を伝えない」の延長)。

   気をつけていること:
   - 明滅は小さなブロックの周りだけにとどめ、画面全体を光らせない。
     利用者に発作の既往がある場合を考えて、広い面積が短時間に明暗するのを避ける
   - 粒は加算合成にしない。背景との明度差を大きくしすぎない
   - prefers-reduced-motion のときは粒を飛ばさず、その場で淡く光って消えるだけにする */
let sparkIdx=-1;
const bits=[], pops=[];
const BITN=13, BITLIFE=.52, POPLIFE=.30, MAXBIT=120, MAXPOP=24;

function spark(x,y,w,h){
  pops.push({x:x,y:y,w:w,h:h,t:0,calm:still.matches});
  if(pops.length>MAXPOP) pops.splice(0,pops.length-MAXPOP);
  if(still.matches) return;                  // 動きを抑える設定では飛ばさない
  const cx=x+w/2, cy=y+h/2;
  for(let i=0;i<BITN;i++){
    const a=Math.PI*2*(i+Math.random())/BITN, v=105*(.5+Math.random()*.9);
    bits.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.75-32,
               s:2.3+Math.random()*3.6,t:0,life:BITLIFE*(.65+Math.random()*.7),
               ph:Math.random()*6.283,      // またたきの位相をずらす
               star:Math.random()<.5,       // 半分は十字に描いてきらめかせる
               c:i%3});
  }
  // 速く連打されたときに粒が積み上がらないよう頭打ちにする。
  // 描画の負荷だけでなく、明滅する面積が広がるのを抑える意味もある。
  if(bits.length>MAXBIT) bits.splice(0,bits.length-MAXBIT);
}

function drawSparks(dt){
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t+=dt;
    if(p.t>=POPLIFE){ pops.splice(i,1); continue; }
    const k=p.t/POPLIFE;
    if(p.calm){
      // 動かさず、その場で淡く光って消える
      g2.globalAlpha=(1-k)*.55;
      g2.fillStyle='#ffe9b8';
      g2.fillRect(p.x,p.y,p.w,p.h);
    }else{
      // ブロックそのものが白く弾けて、もとの色に戻りながら消える
      const e=1-(1-k)*(1-k), gx=e*3.5;
      g2.globalAlpha=(1-k)*(1-k)*.95;
      g2.fillStyle='#fff6e2';
      g2.fillRect(p.x-gx,p.y-gx,p.w+gx*2,p.h+gx*2);
    }
  }
  for(let i=bits.length-1;i>=0;i--){
    const b=bits[i]; b.t+=dt;
    if(b.t>=b.life){ bits.splice(i,1); continue; }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.vy+=230*dt; b.vx*=.94; b.vy*=.985;
    const k=1-b.t/b.life, sz=b.s*(.45+k*.55);
    const tw=.55+.45*Math.sin(b.t*26+b.ph);          // ちらちらさせる
    g2.globalAlpha=Math.min(1,k*k*1.3*tw);
    g2.fillStyle=b.c===0?'#f5a524':(b.c===1?'#ffe08f':'#fffaf0');
    if(b.star){
      // 十字に描くと点よりきらめいて見える。roundRect は使わない(古い Safari 対策)
      const L=sz*2.7, T=Math.max(1.2,sz*.42);
      g2.fillRect(b.x-L/2,b.y-T/2,L,T);
      g2.fillRect(b.x-T/2,b.y-L/2,T,L);
    }else{
      g2.fillRect(b.x-sz/2,b.y-sz/2,sz,sz);
    }
  }
  g2.globalAlpha=1;
}

function rowH(){return H/(hi-lo+1)}
function yOf(n){return (hi-n)*rowH()}

let lastTs=0;
function draw(ts){
  // 経過時間で動かす。フレーム落ちしても見え方が変わらないように
  const dt=(lastTs&&ts)?Math.min(.05,(ts-lastTs)/1000):0;
  lastTs=ts||0;
  try{ paint(dt); }catch(err){
    g2.setTransform(1,0,0,1,0,0);
    g2.fillStyle='#16212b'; g2.fillRect(0,0,cv.width,cv.height);
    g2.fillStyle='#e6edf2'; g2.font='13px system-ui';
    g2.fillText('描画できません: '+err.message,14,26);
  }
  requestAnimationFrame(draw);
}
/* 長い日本語をキャンバスの幅で折り返す */
function drawLines(text,cx,cy,maxw,lh){
  const lines=[]; let cur='';
  for(let i=0;i<text.length;i++){
    const t=cur+text[i];
    if(g2.measureText(t).width>maxw&&cur){ lines.push(cur); cur=text[i]; }
    else cur=t;
  }
  if(cur) lines.push(cur);
  const y0=cy-(lines.length-1)*lh/2;
  lines.forEach(function(l,k){ g2.fillText(l,cx,y0+k*lh); });
}

function paint(dt){
  if(W<40||H<40){ fit(); return; }

  // 曲がまだ無いとき。黙って空白を出さず、理由を書く(仕様書 8 章)
  if(!song){
    g2.clearRect(0,0,W,H);
    g2.textAlign='center'; g2.textBaseline='middle';
    g2.fillStyle=(stage==='error')?'#f5a524':'#8b93a2';
    g2.font='14px '+SANS;
    drawLines(stageMsg,W/2,H/2,Math.min(560,W-56),24);
    g2.textAlign='left';
    return;
  }
  const rh=rowH(), px=Math.round(W*PLAY), KEY=Math.round(Math.min(40,Math.max(28,W*.035)));
  scroll += still.matches ? (idx-scroll) : (idx-scroll)*.22;
  if(Math.abs(idx-scroll)<.002) scroll=idx;

  g2.clearRect(0,0,W,H);

  // 黒鍵の行に薄い帯を敷き、オクターブの切れ目に線を引く
  for(let n=lo;n<=hi;n++){
    if(BLACK.includes(n%12)){ g2.fillStyle='#1a2530'; g2.fillRect(KEY,yOf(n),W-KEY,rh); }
    if(n%12===0){
      g2.fillStyle='rgba(127,168,184,.13)';
      g2.fillRect(KEY,Math.round(yOf(n)+rh)-.5,W-KEY,1);
    }
  }

  // 左端の鍵盤。白鍵を土台にして黒鍵を左寄りに重ねると実物の見え方になる。
  // 行ごとに白鍵を描くと白が分断されて鍵盤に見えない。
  const BK=Math.round(KEY*.62);
  g2.fillStyle='#c5d0da'; g2.fillRect(0,0,KEY,H);
  for(let n=lo;n<=hi;n++){
    if(!BLACK.includes(n%12)) continue;
    g2.fillStyle='#141a21';
    g2.fillRect(0,yOf(n),BK,rh);
  }
  // 黒鍵が挟まらない白鍵どうし(E|F, B|C)の境目にだけ細い線を入れる
  g2.fillStyle='rgba(20,26,33,.32)';
  for(let n=lo;n<=hi;n++){
    const m=n%12;
    if(m===4||m===11) g2.fillRect(0,Math.round(yOf(n))-.5,KEY,1);
  }
  if(rh>9){
    g2.font='500 9px '+MONO; g2.textBaseline='middle'; g2.textAlign='right';
    for(let n=lo;n<=hi;n++){
      if(n%12!==0) continue;
      g2.fillStyle='#4a5560';
      g2.fillText(nameOf(n),KEY-4,yOf(n)+rh/2);
    }
    g2.textAlign='left';
  }
  g2.fillStyle='rgba(0,0,0,.45)'; g2.fillRect(KEY,0,1,H);

  const from=Math.max(0,Math.floor(scroll-px/COL)-1), to=Math.min(song.events.length,Math.ceil(scroll+(W-px)/COL)+1);
  const cur=idx-1;
  for(let i=from;i<to;i++){
    const x=px+(i-scroll)*COL;
    if(x+COL<KEY) continue;
    const on=i===cur;
    song.events[i].values.forEach(v=>{
      if(v<lo||v>hi) return;
      const w=Math.max(3,COL-3), h=Math.max(3,rh-2);
      g2.fillStyle = on?'#f5a524':(i<cur?'#3a4854':'#7fa8b8');
      if(on){g2.shadowColor='rgba(245,165,36,.55)'; g2.shadowBlur=14;}
      const bx=Math.max(KEY+1,x), bw=x<KEY+1?Math.max(3,w-(KEY+1-x)):w;
      g2.fillRect(bx,yOf(v)+1,bw,h);
      g2.shadowBlur=0;
      if(i===sparkIdx) spark(bx,yOf(v)+1,bw,h);
    });
  }
  sparkIdx=-1;   // 画面に出ていない音でも印は消す。あとで急に弾けないように

  // 「いま」の線。動かないので、この曲を待たせているのはこの線だという印になる
  const done=idx>=song.events.length;
  if(!done){
    const gl=g2.createLinearGradient(px-26,0,px+8,0);
    gl.addColorStop(0,'rgba(245,165,36,0)');
    gl.addColorStop(1,'rgba(245,165,36,.13)');
    g2.fillStyle=gl; g2.fillRect(px-26,0,34,H);
  }
  g2.fillStyle=done?'#3a4854':'#f5a524';
  g2.fillRect(px-1,0,2,H);

  drawSparks(dt);

  if(done){
    g2.fillStyle='rgba(19,19,26,.88)'; g2.fillRect(0,0,W,H);
    g2.textAlign='center'; g2.textBaseline='middle';
    g2.fillStyle='#e9edf2'; g2.font='600 21px '+SANS;
    g2.fillText('おわりました',W/2,H/2-13);
    g2.fillStyle='#8b93a2'; g2.font='13px '+SANS;
    g2.fillText('「最初から」でもう一度',W/2,H/2+15);
    g2.fillStyle='#f5a524';
    g2.fillRect(W/2-14,H/2+38,28,2);
    g2.textAlign='left';
  }
}

const elCount=document.getElementById('count'), elNext=document.getElementById('next'),
      elTitle=document.getElementById('title'), elCap=document.querySelector('.next .cap');
function update(){
  if(!song){
    elCount.innerHTML='<b>0</b> / 0';
    elTitle.textContent=(stage==='error')?'読み込めません':'読み込み中';
    elCap.textContent='次の音'; elNext.dataset.end='1'; elNext.textContent='—';
    return;
  }
  elCount.innerHTML='<b>'+idx+'</b> / '+song.events.length;
  elTitle.textContent=song.name;
  const done=idx>=song.events.length;
  elCap.textContent=done?'演奏':'次の音';
  elNext.dataset.end=done?'1':'0';
  if(done){ elNext.textContent='おわりました'; return; }
  elNext.textContent='';
  song.events[idx].values.forEach(function(v){
    const sp=document.createElement('span'); sp.textContent=nameOf(v); elNext.appendChild(sp);
  });
}

/* ---------- 曲と音色の引き出し ---------- */
/* 演奏中に見えているのは譜面だけでよい。設定は必要なときだけ出す。
   開いている間はスペースを演奏に渡さない。引き出しの中の操作に使うため。 */
const panel=document.getElementById('panel'), scrim=document.getElementById('scrim'),
      opener=document.getElementById('open');
let panelOpen=false;
function openPanel(){
  panelOpen=true;
  panel.dataset.open='1'; scrim.dataset.open='1';
  opener.setAttribute('aria-expanded','true');
  release(); if(ctx) allOff();
  // 器そのものに移す。曲や音色のボタンに乗せると、スイッチ(スペース)を
  // 押したときにそのボタンが実行されてしまう。Tab で中の操作には入れる。
  if(panel.focus) panel.focus();
}
function shut(){
  if(!panelOpen) return;
  panelOpen=false;
  panel.dataset.open='0'; scrim.dataset.open='0';
  opener.setAttribute('aria-expanded','false');
  if(cv.focus) cv.focus();      // 閉じたらすぐ演奏に戻れるようにする
}
opener.onclick=()=>panelOpen?shut():openPanel();
document.getElementById('close').onclick=shut;
scrim.onclick=shut;
addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&panelOpen){ ev.preventDefault(); shut(); } });

/* ---------- 入力 ---------- */
const isGo=ev=>ev.code==='Space'||ev.code==='Enter'||ev.key===' '||ev.key==='Spacebar'||ev.key==='Enter';
addEventListener('keydown',ev=>{
  if(!isGo(ev)) return;
  if(panelOpen) return;
  if(ev.target.tagName==='BUTTON'||ev.target.tagName==='INPUT'||ev.target.tagName==='LABEL') return;
  ev.preventDefault(); if(ev.repeat) return; press();
});
addEventListener('keyup',ev=>{ if(isGo(ev)) release(); });

const go=ev=>{ if(panelOpen) return; if(ev.cancelable) ev.preventDefault(); if(cv.focus) cv.focus(); press(); };
if(window.PointerEvent){
  cv.addEventListener('pointerdown',go);
  addEventListener('pointerup',release);
  addEventListener('pointercancel',release);
}else{
  cv.addEventListener('touchstart',go,{passive:false});
  addEventListener('touchend',release);
  addEventListener('touchcancel',release);
  cv.addEventListener('mousedown',go);
  addEventListener('mouseup',release);
}
// マウスやタップでボタンを押したあとは譜面に焦点を戻す。
// 戻さないとボタンにフォーカスが残り、次のスペース入力がボタンの再実行に
// 吸われて演奏が進まない(Chrome で再現。Safari はボタンに焦点が残らない)。
// 支援者がマウスで「1つ戻す」を押し、本人がスイッチで続ける場面で効く。
// キーボードから起動したとき(ev.detail===0)はタブ移動を壊さないので触らない。
document.addEventListener('click',ev=>{
  if(!ev.detail||panelOpen) return;   // 引き出しの操作中は奪わない
  const t=ev.target;
  const b=(t&&t.closest)?t.closest('button'):null;
  if(b&&cv.focus) cv.focus();
});

// iPadOSの二本指ダブルタップ拡大や長押しメニューを抑える
cv.addEventListener('dblclick',ev=>ev.preventDefault());
cv.addEventListener('contextmenu',ev=>ev.preventDefault());
cv.addEventListener('gesturestart',ev=>ev.preventDefault());
addEventListener('blur',release);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    release(); if(ctx) allOff();
    setWet(0,.1);                  // 裏に回ったら響きも残さない
  }else{
    setWet(TONES[tone].wet,.1);
  }
});

/* ---------- 組み立て ---------- */
const list=document.getElementById('songs'),
      songmsg=document.getElementById('songmsg'),
      elRetry=document.getElementById('retry');

function buildList(){
  list.textContent='';
  Songs.list.forEach(function(m){
    const row=document.createElement('div');
    row.className='row'; row.dataset.id=m.id; row.dataset.current='0';
    const b=document.createElement('button');
    b.className='song'; b.setAttribute('aria-current','false');
    b.innerHTML='<span class="nm"></span><span class="taps"></span>';
    b.querySelector('.nm').textContent=m.title;
    b.querySelector('.taps').textContent=m.taps==null?'':m.taps;
    // 曲を選ぶのは決めの操作なので、選んだら閉じて演奏に戻す
    b.onclick=function(){ choose(m); shut(); };
    row.appendChild(b);
    if(m.file){
      // 個別ファイルはそのまま iPad アプリに持っていける形なので、
      // その場で保存できるようにする(仕様書 6 章 第2段階)
      const a=document.createElement('a');
      const nm=m.title.normalize?m.title.normalize('NFC'):m.title;   // NFD 濁点対策
      a.className='dl'; a.href='data/'+m.file; a.setAttribute('download',nm+'.json');
      a.setAttribute('aria-label',m.title+' のデータを保存');
      a.title=m.title+' のデータを保存';
      a.textContent='\u2193';
      row.appendChild(a);
    }
    list.appendChild(row);
  });
}
function markCurrent(id){
  [].forEach.call(list.children,function(row){
    const on=row.dataset.id===id;
    row.dataset.current=on?'1':'0';
    const b=row.querySelector('.song');
    if(b) b.setAttribute('aria-current',String(on));
  });
}
/* 音域外があれば知らせる。データは落とさない(仕様書 2 章) */
function warnRange(ev){
  const bad=outOfRange(ev);
  if(!bad.length){ songmsg.textContent=''; songmsg.dataset.bad='0'; return; }
  songmsg.textContent='MIDI 48〜84 の外に '+bad.length+' 種類の音があります（'+
    bad.map(nameOf).join(' ')+'）。iPad 実機では鳴りません。';
  songmsg.dataset.bad='1';
}

const tw=document.getElementById('tones');
Object.entries(TONES).forEach(([k,v])=>{
  const b=document.createElement('button');
  b.className='tone'; b.textContent=v.label; b.setAttribute('aria-pressed',String(k===tone));
  b.onclick=()=>setTone(k);   // 聴き比べられるよう引き出しは開いたままにする
  tw.appendChild(b);
});
function setTone(k){
  if(ctx) allOff();
  tone=k;
  setWet(TONES[k].wet);
  [...tw.children].forEach((c,i)=>c.setAttribute('aria-pressed',String(Object.keys(TONES)[i]===k)));
  ensureSF();
}

/* 音源の切替。SoundFont は選ばれた音色の分だけその場で読み込む。
   読めなければ合成音のまま鳴らし続ける(音が出ないより音質が落ちるほうが良い)。 */
const sfmsg=document.getElementById('sfmsg'), elAlert=document.getElementById('alert');
function ensureSF(){ SF.load(tone,sfStatus); pickEngine(); sfStatus(); }
function sfStatus(){
  pickEngine();
  /* うまくいっているときは黙る。読み込み中と失敗だけ伝える(仕様書 8 章)。 */
  let t='', bad='0';
  if(SF.state[tone]==='loading') t=TONES[tone].label+'の音を読み込んでいます。それまでは簡易な音で鳴ります。';
  else if(SF.state[tone]!=='ready'){ t=(SF.msg[tone]||'音を読み込めませんでした')+' 簡易な音で鳴らします。'; bad='1'; }
  sfmsg.textContent=t; sfmsg.dataset.bad=bad;
  // 引き出しが閉じていても失敗に気づけるようにする(仕様書 8 章)
  elAlert.textContent=bad==='1'?'音を読み込めませんでした':'';
  elAlert.dataset.on=bad;
}

document.getElementById('back').onclick=()=>step(-1);
document.getElementById('reset').onclick=()=>{ if(!song) return; idx=0; if(ctx)allOff(); update(); };
elRetry.onclick=function(){ Songs.list.length&&pending ? choose(pending) : boot(); };

document.getElementById('file').onchange=ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const events=validate(JSON.parse(r.result));
      const meta={id:'local-'+Date.now(),title:f.name.replace(/\.json$/i,''),taps:events.length};
      Songs.list.push(meta); Songs.cache[meta.id]=events;
      buildList(); apply(meta,events); shut();
    }catch(e){
      songmsg.textContent='このファイルは読み込めません。'+(e&&e.message?e.message+'。':'')+'タップ演奏データの JSON を選んでください。';
      songmsg.dataset.bad='1';
    }
  };
  r.onerror=()=>{ songmsg.textContent='ファイルを読めませんでした。'; songmsg.dataset.bad='1'; };
  r.readAsText(f);
};

fit(); ensureSF(); draw(); boot();
</script>
